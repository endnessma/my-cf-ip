name: 优选 IPv4（443端口，精准延迟）

on:
  schedule:
    - cron: '0 */3 * * *'       # 每3小时整点执行
  workflow_dispatch:            # 支持手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # 允许推送到仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: TCP 443 端口延迟测试（取前20）
        run: |
          # 生成 IP 列表（跳过 .0 和 .255）
          for i in {1..254}; do
            echo "172.64.229.$i"
          done > ip_list.txt

          # ----- 定义精准测试函数 -----
          # 使用 curl 的 time_connect 测量 TCP 三次握手时间（单位：秒）
          # 超时设为 3 秒，避免假死；-k 忽略证书，-s 静默
          test_ip() {
            ip=$1
            # 尝试连接，若失败或超时则返回空
            time=$(curl -o /dev/null -s -w "%{time_connect}" --connect-timeout 3 -k "https://${ip}:443" 2>/dev/null)
            # 只保留有效连接（非零且非0.000）
            if [ -n "$time" ] && [ "$time" != "0.000" ] && [ "$time" != "0" ]; then
              echo "$ip $time"
            fi
          }
          export -f test_ip

          # 并发测试：50 个进程同时测量，大幅提升速度
          cat ip_list.txt | xargs -P 50 -I {} bash -c 'test_ip "$@"' _ {} > raw_result.txt

          # 若没有可用 IP，输出提示并退出
          if [ ! -s raw_result.txt ]; then
            echo "未找到任何可用的 443 端口 IP" > best_ips.txt
            echo "未找到任何可用的 443 端口 IP" > best_ips_iponly.txt
            exit 0
          fi

          # 按延迟升序排序，取前 20
          sort -k2 -n raw_result.txt | head -20 > sorted.txt

          # 生成带延迟的文本（IP:端口 + 延迟毫秒）
          awk '{printf "%-18s %.2f ms\n", $1 ":443", $2*1000}' sorted.txt > best_ips.txt

          # 生成仅 IP:端口 列表（无延迟）
          awk '{print $1 ":443"}' sorted.txt > best_ips_iponly.txt

          # 打印统计信息（供查看）
          total=$(wc -l < raw_result.txt)
          echo "✅ 成功连接 443 端口的 IP 总数：$total"
          echo "📋 延迟最低的前 20 个 IP："
          cat best_ips.txt

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips.txt best_ips_iponly.txt
          git diff --staged --quiet || git commit -m "自动更新优选IP（443端口，$(date +'%Y-%m-%d %H:%M:%S')）"
          git push
