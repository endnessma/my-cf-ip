name: 优选 IPv6（443端口，TLS+HTTP双验证，带编号标签）

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: IPv6 精准扫描（三次采样取中位数，强制覆盖三CIDR）
        run: |
          set -e

          # ==================== 你的实际配置 ====================
          DOMAIN="cmwk.eccome.ccwu.cc"          # 改为你的实际域名
          URI_PATH="/proxyip=kr.william.us.ci"  # 改为你的实际路径
          EXPECT_STATUS="101,200,204"           # 认为"通"的 HTTP 状态码，按你 Worker 实际返回值调整
          TOP_N=20                              # 最终取前多少个
          PER_CIDR_MIN=5                        # 每个前缀至少强制保留几个（若不足则全取）
          CONCURRENCY=100                       # 并发数

          # 三个 IPv6 前缀，每个前缀只扫 ::1 ~ ::fe（256个地址空间中的一小段，
          # 目的是控制扫描总量，不是这些前缀下真实可用IP只有这么多）
          prefixes=(
            "2606:4700:5a"
            "2606:4700:52"
            "2606:4700:57"
          )
          export DOMAIN URI_PATH EXPECT_STATUS
          # =====================================================

          echo "🔍 目标域名: $DOMAIN, 路径: $URI_PATH"
          echo "生成 IPv6 地址列表（每个前缀下 ::1 ~ ::fe）..."

          : > ip_list.txt
          for prefix in "${prefixes[@]}"; do
            for i in $(seq 1 254); do
              printf "%s::%x\n" "$prefix" "$i"
            done
          done >> ip_list.txt

          total_ips=$(wc -l < ip_list.txt)
          echo "📡 总待测 IPv6 数量：$total_ips"

          # 测试函数：三次采样取中位数 + HTTP 状态码校验
          test_ip() {
            ip=$1
            times=()
            status=""
            for n in 1 2 3; do
              out=$(curl -o /dev/null -s \
                -w "%{http_code} %{time_total}" \
                --connect-timeout 1.5 \
                --max-time 4 \
                -k \
                --resolve "${DOMAIN}:443:${ip}" \
                -H "Host: ${DOMAIN}" \
                "https://${DOMAIN}${URI_PATH}" 2>/dev/null) || out="000 999"

              code=$(echo "$out" | awk '{print $1}')
              t=$(echo "$out" | awk '{print $2}')
              [ -z "$status" ] && status="$code"

              if [ "$code" = "000" ]; then
                return
              fi
              times+=("$t")
            done

            if [[ ",${EXPECT_STATUS}," != *",${status},"* ]]; then
              return
            fi

            median_ms=$(printf '%s\n' "${times[@]}" | sort -n | awk '
              { a[NR]=$1 }
              END {
                if (NR % 2 == 1) m = a[(NR+1)/2]
                else m = (a[NR/2] + a[NR/2+1]) / 2
                printf "%.2f", m * 1000
              }')

            echo "$ip $median_ms $status"
          }
          export -f test_ip

          cat ip_list.txt | xargs -P "$CONCURRENCY" -I {} bash -c 'test_ip "$1"' _ {} > raw_result.txt || true

          total_available=$(wc -l < raw_result.txt 2>/dev/null || echo 0)
          echo "✅ 有效可用 IPv6 总数：$total_available"

          if [ "$total_available" -eq 0 ]; then
            echo "⚠️ 未找到任何可用 IPv6 地址" > best_ips_v6.txt
            echo "未找到" > best_ips_iponly_v6.txt
            exit 0
          fi

          # ----- 强制每个 CIDR 至少取 PER_CIDR_MIN 个（若不足则全取），再补齐至 TOP_N -----
          : > forced.txt
          total_forced=0
          for p in "${prefixes[@]}"; do
            grep "^${p}" raw_result.txt | sort -k2 -n > "${p//:/_}.all"
            count=$(wc -l < "${p//:/_}.all")
            if [ "$count" -eq 0 ]; then
              echo "⚠️ CIDR ${p}::/48 无可用IP"
              continue
            fi
            take=$(( count < PER_CIDR_MIN ? count : PER_CIDR_MIN ))
            head -n "$take" "${p//:/_}.all" >> forced.txt
            total_forced=$((total_forced + take))
          done

          # 用 awk 一次性排除已强制选中的 IP（比 grep -f 逐行匹配更快更稳）
          awk '
            NR==FNR { forced[$1]=1; next }
            !($1 in forced)
          ' forced.txt raw_result.txt > raw_remaining.txt

          need=$((TOP_N - total_forced))
          if [ "$need" -gt 0 ]; then
            sort -k2 -n raw_remaining.txt | head -n "$need" > remaining_top.txt
          else
            : > remaining_top.txt
          fi

          cat forced.txt remaining_top.txt | sort -k2 -n | head -n "$TOP_N" > sorted.txt

          final_count=$(wc -l < sorted.txt)
          echo "📋 最终优选 IPv6（强制覆盖三CIDR，共 $final_count 个）："

          awk '{printf "[%s]:443  %.2f ms  #JP-GHv6 %02d\n", $1, $2, NR}' sorted.txt > best_ips_v6.txt
          awk '{printf "[%s]:443#JP-GHv6 %02d\n", $1, NR}' sorted.txt > best_ips_iponly_v6.txt

          cat best_ips_iponly_v6.txt

          # 清理临时文件（不影响 git add，只是保持 workspace 干净）
          rm -f ./*.all forced.txt forced_ips.txt raw_remaining.txt remaining_top.txt sorted.txt raw_result.txt ip_list.txt

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips_v6.txt best_ips_iponly_v6.txt
          git diff --staged --quiet || git commit -m "自动更新优选IPv6 $(date +'%Y-%m-%d %H:%M:%S')"
          git push
