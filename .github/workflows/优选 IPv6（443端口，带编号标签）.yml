name: 优选 IPv6（443端口，诊断+修复版）

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 诊断 IPv6 出站能力
        run: |
          echo "===== 1. 检查本机是否有 IPv6 地址 ====="
          ip -6 addr show || echo "❌ 无 IPv6 地址配置"

          echo ""
          echo "===== 2. 测试到公网 IPv6 的连通性 ====="
          curl -6 -v --connect-timeout 5 --max-time 8 https://ipv6.google.com 2>&1 | tail -15 || echo "❌ IPv6 出站基础连通性失败"

          echo ""
          echo "===== 3. 测试到 Cloudflare IPv6 的连通性 ====="
          curl -6 -v --connect-timeout 5 --max-time 8 "https://[2606:4700:4700::1111]" 2>&1 | tail -15 || echo "❌ 连不到 Cloudflare IPv6"

          echo ""
          echo "===== 4. 测试实际目标域名 + 手动指定一个 IPv6（带[]写法）====="
          curl -v -k --connect-timeout 5 --max-time 8 \
            --resolve "cmwk.eccome.ccwu.cc:443:[2606:4700:5a::1]" \
            -H "Host: cmwk.eccome.ccwu.cc" \
            "https://cmwk.eccome.ccwu.cc/proxyip=kr.william.us.ci" 2>&1 | tail -25 || echo "❌ 目标测试失败"

          echo ""
          echo "===== 诊断结束，请查看以上日志判断具体问题层级 ====="

      - name: IPv6 精准扫描（三次采样，宽松状态码判断，[]包裹修复）
        run: |
          set -e

          # ==================== 你的实际配置 ====================
          DOMAIN="cmwk.eccome.ccwu.cc"
          URI_PATH="/proxyip=kr.william.us.ci"
          TOP_N=20
          PER_CIDR_MIN=5
          CONCURRENCY=100

          prefixes=(
            "2606:4700:5a"
            "2606:4700:52"
            "2606:4700:57"
          )
          export DOMAIN URI_PATH
          # =====================================================

          echo "🔍 目标域名: $DOMAIN, 路径: $URI_PATH"

          : > ip_list.txt
          for prefix in "${prefixes[@]}"; do
            for i in $(seq 1 254); do
              printf "%s::%x\n" "$prefix" "$i"
            done
          done >> ip_list.txt

          total_ips=$(wc -l < ip_list.txt)
          echo "📡 总待测 IPv6 数量：$total_ips"

          # 测试函数：三次采样取中位数
          # 状态码判断放宽为：只要不是 000（连接失败/超时）就算连通并记录延迟
          # 同时把实际拿到的状态码也记下来，方便你事后看日志确认该收紧成哪些值
          test_ip() {
            ip=$1
            times=()
            status=""
            for n in 1 2 3; do
              out=$(curl -o /dev/null -s \
                -w "%{http_code} %{time_total}" \
                --connect-timeout 1.5 \
                --max-time 4 \
                -k \
                --resolve "${DOMAIN}:443:[${ip}]" \
                -H "Host: ${DOMAIN}" \
                "https://${DOMAIN}${URI_PATH}" 2>/dev/null) || out="000 999"

              code=$(echo "$out" | awk '{print $1}')
              t=$(echo "$out" | awk '{print $2}')
              [ -z "$status" ] && status="$code"

              if [ "$code" = "000" ]; then
                return
              fi
              times+=("$t")
            done

            median_ms=$(printf '%s\n' "${times[@]}" | sort -n | awk '
              { a[NR]=$1 }
              END {
                if (NR % 2 == 1) m = a[(NR+1)/2]
                else m = (a[NR/2] + a[NR/2+1]) / 2
                printf "%.2f", m * 1000
              }')

            echo "$ip $median_ms $status"
          }
          export -f test_ip

          cat ip_list.txt | xargs -P "$CONCURRENCY" -I {} bash -c 'test_ip "$1"' _ {} > raw_result.txt || true

          total_available=$(wc -l < raw_result.txt 2>/dev/null || echo 0)
          echo "✅ 有效可用 IPv6 总数：$total_available"

          # 打印状态码分布，帮你判断哪些码是"正常"的，后续可以再加回严格过滤
          if [ "$total_available" -gt 0 ]; then
            echo "--- 状态码分布 ---"
            awk '{print $3}' raw_result.txt | sort | uniq -c | sort -rn
          fi

          if [ "$total_available" -eq 0 ]; then
            echo "⚠️ 未找到任何可用 IPv6 地址（请查看上方诊断步骤日志确认原因）" > best_ips_v6.txt
            echo "未找到" > best_ips_iponly_v6.txt
            exit 0
          fi

          : > forced.txt
          total_forced=0
          for p in "${prefixes[@]}"; do
            grep "^${p}" raw_result.txt | sort -k2 -n > "${p//:/_}.all"
            count=$(wc -l < "${p//:/_}.all")
            if [ "$count" -eq 0 ]; then
              echo "⚠️ CIDR ${p}::/48 无可用IP"
              continue
            fi
            take=$(( count < PER_CIDR_MIN ? count : PER_CIDR_MIN ))
            head -n "$take" "${p//:/_}.all" >> forced.txt
            total_forced=$((total_forced + take))
          done

          awk '
            NR==FNR { forced[$1]=1; next }
            !($1 in forced)
          ' forced.txt raw_result.txt > raw_remaining.txt

          need=$((TOP_N - total_forced))
          if [ "$need" -gt 0 ]; then
            sort -k2 -n raw_remaining.txt | head -n "$need" > remaining_top.txt
          else
            : > remaining_top.txt
          fi

          cat forced.txt remaining_top.txt | sort -k2 -n | head -n "$TOP_N" > sorted.txt

          final_count=$(wc -l < sorted.txt)
          echo "📋 最终优选 IPv6（强制覆盖三CIDR，共 $final_count 个）："

          awk '{printf "[%s]:443  %.2f ms  #JP-GHv6 %02d\n", $1, $2, NR}' sorted.txt > best_ips_v6.txt
          awk '{printf "[%s]:443#JP-GHv6 %02d\n", $1, NR}' sorted.txt > best_ips_iponly_v6.txt

          cat best_ips_iponly_v6.txt

          rm -f ./*.all forced.txt raw_remaining.txt remaining_top.txt sorted.txt raw_result.txt ip_list.txt

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips_v6.txt best_ips_iponly_v6.txt
          git diff --staged --quiet || git commit -m "自动更新优选IPv6 $(date +'%Y-%m-%d %H:%M:%S')"
          git push
